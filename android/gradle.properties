org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Base URL of the MRR server. The default targets the host machine from the
# Android emulator (10.0.2.2). Build against a LAN server with:
#   ./gradlew assembleDebug -Pmrr.baseUrl=http://192.168.1.10:8080/
mrr.baseUrl=http://10.0.2.2:8080/

# Base URL of the MRR server used by the MRR Patcher app (:patcher). The
# default (http://192.168.188.105:8080/) lives in patcher/build.gradle.kts;
# override per build with:
#   ./gradlew :patcher:assembleDebug -Pmrr.patcher.baseUrl=http://192.168.1.10:8080/
