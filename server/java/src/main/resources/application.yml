server:
  port: 8080

spring:
  application:
    name: mrr-server
  datasource:
    url: "jdbc:sqlite:${mrr.data-dir}/mrr.db"
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect

mrr:
  data-dir: ./data
  patch-dir: ./patch-files
  session-ttl-seconds: 86400
  password-iterations: 600000
  
  # Backup-Konfiguration
  backup:
    enabled: true
    target: ./backups
    db-backup-interval-minutes: 15
    full-backup-interval-minutes: 30
    retention-days: 30